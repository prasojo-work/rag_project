<article class="turn error-turn">
  <div class="turn-question">
    <span class="turn-label">Permintaan tidak diproses</span>
  </div>
  <div class="turn-answer">
    <div class="callout callout-danger">
      <strong>{{ title or 'Tidak bisa diproses.' }}</strong>
      <p>{{ message }}</p>
    </div>
    <p class="muted">Coba perjelas pertanyaan atau gunakan contoh pertanyaan di panel kanan.</p>
  </div>
</article>
